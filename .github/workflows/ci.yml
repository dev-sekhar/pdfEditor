name: Test and build
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify native text and claims-form workflows
        run: npx playwright test tests/e2e/native-forms.spec.js tests/e2e/recognized-forms.spec.js
