name: Build PDF Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  word-layout:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install conversion test dependencies
        run: npm ci
      - name: Install browser and document renderer on cloud runner
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-liberation poppler-utils
      - name: Exercise Word exports
        run: npx playwright test tests/e2e/word-export.spec.js
      - name: Render Word exports and check pagination
        run: python3 scripts/verify-word-layout.py
      - name: Upload synthetic Word layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Word-export-layout-${{ github.sha }}
          path: word-layout-results/
          if-no-files-found: warn
          retention-days: 7
  windows:
    needs: word-layout
    if: github.ref == 'refs/heads/dev'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run PDF operation tests
        run: npm test
      - name: Install cloud browser for UI tests
        run: npx playwright install chromium
      - name: Test editor, redaction and Word export in browser
        run: npm run test:e2e
      - name: Package Windows installers
        # Tauri runs npm run build via beforeBuildCommand.
        run: npx tauri build --bundles nsis,msi
      - name: Verify both installer formats
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($exe.Count -eq 0 -or $msi.Count -eq 0) {
            throw 'Both an EXE setup installer and an MSI are required.'
          }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
